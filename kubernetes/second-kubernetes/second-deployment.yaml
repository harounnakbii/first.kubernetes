apiVersion: apps/v1
kind: Deployment
metadata:
  name: secondkubernetes
  labels:
    app: secondkubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secondkubernetes
  template:
    metadata:
      labels:
        app: secondkubernetes
    spec:
      containers:
        - name: secondkubernetes
          image: secondkubernetes:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # Configuration du service à appeler
            - name: FirstApiUrl
              value: "http://first-kubernetes-service:8080"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
